id = "goose"
name = "Goose"
version = "0.2.0"
schema_version = 1
description = "Goose language support: syntax highlighting, the Goose language server (diagnostics, hover, go to definition, references, rename, symbols, completion, signature help, inlay hints, folding, formatting), snippets and run tasks."
authors = ["Simon Zheng"]
repository = "https://github.com/ZHENGSY/goose-zed"

snippets = ["./snippets/goose.json"]

[language_servers.goose]
name = "Goose LSP"
languages = ["Goose"]

[grammars.goose]
# The grammar lives in this repository; Zed's grammar loader clones it and
# compiles the checked-in parser at `path`. `rev` points at a commit on main
# that contains the generated `src/parser.c`.
repository = "https://github.com/ZHENGSY/goose-zed"
rev = "20f5a750fefe3f2d246b2b851b0d13887d10a716"
path = "tree-sitter-goose"
