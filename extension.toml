id = "goose"
name = "Goose"
version = "0.1.0"
schema_version = 1
description = "Goose language support: syntax highlighting, the Goose language server (diagnostics, hover, go to definition, references, rename, symbols, completion, signature help, inlay hints, folding), snippets and run tasks."
authors = ["Goose contributors"]
repository = "https://github.com/aardappel/goose"

snippets = ["./snippets/goose.json"]

[language_servers.goose]
name = "Goose LSP"
languages = ["Goose"]

[grammars.goose]
