id = "goose"
name = "Goose"
version = "0.1.0"
schema_version = 1
description = "Goose language support: syntax highlighting, the Goose language server (diagnostics, hover, go to definition, references, rename, symbols, completion, signature help, inlay hints, folding), snippets and run tasks."
authors = ["Goose contributors"]
repository = "https://github.com/ZHENGSY/goose-zed"

snippets = ["./snippets/goose.json"]

[language_servers.goose]
name = "Goose LSP"
languages = ["Goose"]

[grammars.goose]
# The grammar lives in this repository; Zed's grammar loader clones it and
# compiles the checked-in parser at `path`. `rev` points at a commit on main
# that contains the generated `src/parser.c`.
repository = "https://github.com/ZHENGSY/goose-zed"
rev = "8a0cb4920e603cef945b942393493d5057fc4f64"
path = "tree-sitter-goose"
